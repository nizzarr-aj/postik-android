name: Unpack POSTIK Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unpack POSTIK ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname 'POSTIK_ANDROID*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "POSTIK Android ZIP not found"
            exit 1
          fi

          rm -rf extracted
          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Copy Android files only
        run: |
          set -e

          if [ -d extracted/app ]; then
            cp -R extracted/app .
          fi

          for file in build.gradle gradle.properties settings.gradle; do
            if [ -f "extracted/$file" ]; then
              cp "extracted/$file" .
            fi
          done

          if [ -f extracted/README.txt ]; then
            cp extracted/README.txt .
          fi

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app build.gradle gradle.properties settings.gradle README.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No Android changes to commit"
          else
            git commit -m "Update POSTIK Android app and logo"
            git push
          fi
