name: Build POSTIK Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android 36 SDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.POSTIK_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing POSTIK_UPLOAD_KEYSTORE_BASE64 secret"
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/postik-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/postik-upload-key.jks"

      - name: Build signed Release AAB
        env:
          POSTIK_KEYSTORE_FILE: ${{ runner.temp }}/postik-upload-key.jks
          POSTIK_KEYSTORE_PASSWORD: ${{ secrets.POSTIK_KEYSTORE_PASSWORD }}
          POSTIK_KEY_ALIAS: ${{ secrets.POSTIK_KEY_ALIAS }}
          POSTIK_KEY_PASSWORD: ${{ secrets.POSTIK_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$POSTIK_KEYSTORE_PASSWORD" ] || [ -z "$POSTIK_KEY_ALIAS" ] || [ -z "$POSTIK_KEY_PASSWORD" ]; then
            echo "Missing one or more POSTIK signing secrets"
            exit 1
          fi

          gradle bundleRelease --no-daemon \
            -PPOSTIK_KEYSTORE_FILE="$POSTIK_KEYSTORE_FILE" \
            -PPOSTIK_KEYSTORE_PASSWORD="$POSTIK_KEYSTORE_PASSWORD" \
            -PPOSTIK_KEY_ALIAS="$POSTIK_KEY_ALIAS" \
            -PPOSTIK_KEY_PASSWORD="$POSTIK_KEY_PASSWORD"

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: POSTIK-PlayStore-AAB-v1.6
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
