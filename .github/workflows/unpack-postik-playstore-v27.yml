name: Unpack POSTIK Play Store V27

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Play Store ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname 'POSTIK_PLAYSTORE_V27*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "POSTIK Play Store V27 ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf extracted
          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Locate package folder
        run: |
          set -e

          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "Package folder not found"
            exit 1
          fi

          echo "Package root: $ROOT"
          echo "PACKAGE_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Apply Play Store Android files
        run: |
          set -e

          if [ -d "$PACKAGE_ROOT/app" ]; then
            rm -rf app
            cp -R "$PACKAGE_ROOT/app" .
          fi

          if [ -f "$PACKAGE_ROOT/build.gradle" ]; then
            cp "$PACKAGE_ROOT/build.gradle" .
          fi

          if [ -f "$PACKAGE_ROOT/gradle.properties" ]; then
            cp "$PACKAGE_ROOT/gradle.properties" .
          fi

          if [ -f "$PACKAGE_ROOT/settings.gradle" ]; then
            cp "$PACKAGE_ROOT/settings.gradle" .
          fi

          echo "POSTIK Play Store files applied."

      - name: Show Android version
        run: |
          echo "Checking app/build.gradle:"
          cat app/build.gradle

      - name: Commit Play Store update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app build.gradle gradle.properties settings.gradle 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Prepare POSTIK for Google Play Store"
            git push
          fi
